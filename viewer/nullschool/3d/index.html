<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather · 三维地球</title>
    <link rel="icon" href="../favicon.ico" />
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body class="earth-three">
    <main id="three-stage" aria-label="三维天气地球"></main>
    <div id="sponsor">
      <p id="three-source">Three.js · 三维地球</p>
      <p id="three-valid">正在加载 GFS…</p>
      <p id="three-cloud-time"></p>
    </div>
    <div id="details">
      <aside
        id="three-load-status"
        role="status"
        aria-live="polite"
        aria-label="加载进度"
      >
        <p id="three-map-status" role="status">正在加载地球…</p>
        <p id="three-building-status" role="status"></p>
        <p id="three-field-status" class="earth-note" hidden>
          填色等待对应高度…
        </p>
        <p id="height-contour-status" class="earth-note" hidden></p>
        <p id="isobar-status" class="earth-note" hidden></p>
        <p id="three-data-status" class="earth-note" role="status"></p>
        <p class="earth-note">
          <span id="three-height-status">正在加载风温层高度…</span>
          <button id="retry-height" class="text-button" hidden>重试图层</button>
        </p>
        <button id="retry-map" class="text-button" hidden>重试地图</button>
        <button id="retry-buildings" class="text-button" hidden>
          重试建筑
        </button>
        <button id="retry-contours" class="text-button" hidden>
          重试等值线
        </button>
      </aside>
      <div id="location" hidden>
        <p>
          <span id="location-coord"></span>
          <button id="location-close" class="text-button" aria-label="关闭点位">
            ×
          </button>
        </p>
        <p id="three-place"></p>
        <p id="three-point-wind"></p>
        <p id="three-point-temp"></p>
        <p id="three-point-pressure"></p>
        <p id="three-point-layer"></p>
        <p id="three-point-height"></p>
      </div>
      <section
        id="menu"
        class="invisible"
        aria-hidden="true"
        aria-label="三维图层设置"
      >
        <p>
          视角 | <button class="text-button" data-view="world">全球</button>
          <button class="text-button" data-view="china">中国</button>
        </p>
        <p>
          底图 |
          <button
            class="text-button"
            data-basemap="google"
            aria-pressed="false"
          >
            实景三维
          </button>
          <button
            class="text-button"
            data-basemap="terrain"
            aria-pressed="false"
          >
            卫星地形
          </button>
        </p>
        <p id="photo-note" class="earth-note" hidden></p>
        <p id="terrain-options">
          地形 |
          <label class="earth-toggle"
            ><input id="satellite" type="checkbox" checked />卫星影像</label
          >
          <label class="earth-toggle"
            ><input id="terrain" type="checkbox" checked />3D 地形</label
          >
        </p>
        <p id="building-options">
          建筑 |
          <label class="earth-toggle"
            ><input id="buildings" type="checkbox" checked />3D 建筑</label
          >
        </p>
        <p>
          边界 |
          <label class="earth-toggle"
            ><input id="countries" type="checkbox" checked />国家</label
          >
          <label class="earth-toggle"
            ><input id="provinces" type="checkbox" checked />省</label
          >
          <label class="earth-toggle"
            ><input id="cities" type="checkbox" />市</label
          >
        </p>
        <p>
          水系 |
          <label class="earth-toggle"
            ><input id="rivers" type="checkbox" checked />主要河流与湖泊</label
          >
        </p>
        <p>
          云图 |
          <label class="earth-toggle"
            ><input id="cloud" type="checkbox" />东亚红外</label
          >
          <button id="refresh-cloud" class="text-button">更新影像</button>
        </p>
        <p>
          天气 |
          <label class="earth-toggle"
            ><input id="wind" type="checkbox" checked />风线</label
          >
        </p>
        <p role="group" aria-label="气象填色">
          填色 |
          <label class="earth-toggle"
            ><input
              id="color-none"
              name="weather-color"
              type="radio"
              checked
            />无</label
          >
          <label class="earth-toggle"
            ><input
              id="wind-speed"
              name="weather-color"
              type="radio"
            />风速</label
          >
          <label class="earth-toggle"
            ><input
              id="temperature"
              name="weather-color"
              type="radio"
            />气温</label
          >
        </p>
        <p class="earth-range-row">
          <label for="weather-opacity">填色不透明度 | </label
          ><input
            id="weather-opacity"
            type="range"
            min="0"
            max="0.8"
            step="0.05"
            value="0.4"
          /><output id="opacity-value">40%</output>
        </p>
        <p class="scale-row" id="three-scale-row" hidden>
          <span id="three-scale-title">气温 | −80°C</span
          ><canvas id="three-scale" class="earth-color-scale"></canvas
          ><span id="three-scale-end">55°C</span>
        </p>
        <p role="group" aria-label="气压层">
          高度 | <span id="three-heights"></span>
        </p>
        <p class="earth-range-row">
          <label for="height-scale">风温层高度放大 | </label>
          <input
            id="height-scale"
            type="range"
            min="1"
            max="20"
            step="1"
            value="1"
          />
          <output id="height-scale-value">1×</output>
        </p>
        <p>
          等值线 |
          <label class="earth-toggle"
            ><input id="height-contours" type="checkbox" /><span
              class="earth-contour-swatch"
              aria-hidden="true"
            ></span
            >位势高度线</label
          >
          <label class="earth-toggle"
            ><input id="isobars" type="checkbox" /><span
              class="earth-contour-swatch isobars"
              aria-hidden="true"
            ></span
            >海平面等压线</label
          >
        </p>
        <p></p>
        <details class="earth-line-style" id="line-style-settings">
          <summary>线条样式</summary>
          <div class="earth-line-style-fields">
            <label class="earth-style-field" for="line-style-layer"
              >图层<select id="line-style-layer"></select
            ></label>
            <div class="earth-style-field">
              <label for="line-style-color">颜色</label>
              <div class="earth-style-color-row">
                <input
                  id="line-style-color"
                  type="color"
                  aria-label="线条颜色"
                />
                <input
                  id="line-style-hex"
                  type="text"
                  maxlength="7"
                  spellcheck="false"
                  aria-label="颜色十六进制值"
                />
                <svg
                  id="line-style-preview"
                  viewBox="0 0 160 24"
                  role="img"
                  aria-label="线条样式预览"
                >
                  <path
                    id="line-style-preview-path"
                    d="M4 17 C42 17 54 7 80 7 S122 17 156 17"
                    fill="none"
                  />
                </svg>
              </div>
            </div>
            <label class="earth-style-field" for="line-style-pattern"
              >线型<select id="line-style-pattern">
                <option value="solid">实线</option>
                <option value="dashed">虚线</option>
                <option value="dotted">点线</option>
              </select></label
            >
            <div class="earth-style-range">
              <label for="line-style-width">粗细</label
              ><input
                id="line-style-width"
                type="range"
                min="0.5"
                max="6"
                step="0.1"
              /><output id="line-style-width-value"></output>
            </div>
            <div class="earth-style-range">
              <label for="line-style-opacity">不透明度</label
              ><input
                id="line-style-opacity"
                type="range"
                min="0"
                max="100"
                step="1"
              /><output id="line-style-opacity-value"></output>
            </div>
            <div id="line-style-label-options">
              <label class="earth-toggle"
                ><input
                  id="line-style-labels"
                  type="checkbox"
                />显示数值标注</label
              >
              <div class="earth-style-range">
                <label for="line-style-label-size">标注字号</label
                ><input
                  id="line-style-label-size"
                  type="range"
                  min="10"
                  max="20"
                  step="1"
                /><output id="line-style-label-value"></output>
              </div>
            </div>
            <p id="line-style-scope" hidden></p>
            <div class="earth-style-actions">
              <button id="line-style-reset" class="text-button" type="button">
                恢复本层默认</button
              ><span
                id="line-style-status"
                class="earth-note"
                role="status"
              ></span>
            </div>
          </div>
        </details>
        <p>预报 | <span id="three-date">加载中…</span></p>
        <p>起报 | <span id="three-run">加载中…</span></p>

        <p>
          <a id="classic-link" class="internal-link" href="../">经典气象模式</a>
          ·
          <a class="internal-link" href="about.html" target="_blank"
            >图层与数据说明</a
          >
        </p>
      </section>
      <h1 id="earth">
        <button
          id="show-menu"
          class="text-button"
          aria-controls="menu"
          aria-expanded="false"
        >
          earth 3D
        </button>
      </h1>
    </div>
    <div class="earth-attribution">
      <span id="base-credit"
        >Cesium World Terrain · Esri / Maxar / Earthstar Geographics
      </span>
      <span id="provider-credit"></span><span id="tile-credit"></span> · Natural
      Earth · DataV · NOAA GFS<span id="cloud-credit"></span
      ><span id="building-credit"></span>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
