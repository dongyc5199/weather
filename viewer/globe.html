<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>天气丝滑地球</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23050914'/%3E%3Cpath d='M6 18c4-8 11-10 20-6-1 10-8 15-18 12l5-5z' fill='%2337c8ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./globe.css?v=20260703-maplibre-v3" />
  </head>
  <body>
    <main class="globe-shell">
      <canvas id="starCanvas" class="star-canvas" aria-hidden="true"></canvas>
      <div class="space-glow" aria-hidden="true"></div>
      <section id="map" class="globe-map" aria-label="MapLibre 天气地球"></section>
      <aside class="globe-panel">
        <header>
          <p>MapLibre Globe</p>
          <h1>天气丝滑地球</h1>
        </header>
        <div class="control-grid">
          <button id="loadDefaultWeather" type="button">开放数据</button>
          <button id="fitWeather" type="button">缩放天气</button>
        </div>
        <label class="field">
          <span>GeoJSON URL</span>
          <input id="geoJsonUrlInput" type="url" placeholder="../examples/open-data-weather-elements.geojson" />
        </label>
        <button id="loadGeoJsonUrl" type="button">加载 GeoJSON</button>
        <label class="field">
          <span>Manifest URL</span>
          <input id="manifestUrlInput" type="url" placeholder="../examples/open-data-weather-manifest.json" />
        </label>
        <button id="loadManifestUrl" type="button">加载过程</button>
        <section class="timeline">
          <div class="timeline-head">
            <strong id="timeLabel">等待过程</strong>
            <button id="playManifest" type="button">播放</button>
          </div>
          <input id="timeRange" type="range" min="0" max="0" value="0" step="1" disabled />
        </section>
        <label class="range-field">
          <span>天气透明度</span>
          <input id="weatherOpacity" type="range" min="0.15" max="0.9" value="0.46" step="0.01" />
        </label>
        <div class="control-grid">
          <button id="toggleCloud" type="button">云图</button>
          <button id="toggleRadar" type="button">雷达</button>
        </div>
        <label class="check-row">
          <input id="autoRotate" type="checkbox" checked />
          <span>慢速自转</span>
        </label>
        <div class="control-grid">
          <button id="clearWeather" type="button">清空</button>
          <a href="./earth.html?weather=0">高级 3D</a>
        </div>
        <footer>
          <strong id="sourceName">等待数据</strong>
          <span id="featureCount">0 个要素</span>
          <span id="statusText">正在初始化。</span>
          <small id="detailText"></small>
        </footer>
      </aside>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="./globe.js?v=20260703-maplibre-v3"></script>
  </body>
</html>
